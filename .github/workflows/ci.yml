name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 测试中的 LLM 调用全部 mock,不需要真实 key
      ANTHROPIC_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: 单元测试(路由、兜底、成本统计、API、评测 prompt)
        run: pytest -q
      - name: 幻觉率评测 dry-run(校验用例与脚本可用,不调用 API)
        run: python -m evals.hallucination_eval --dry-run

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建前后端镜像
        run: |
          docker build -t job-copilot-backend ./backend
          docker build -t job-copilot-frontend ./frontend
