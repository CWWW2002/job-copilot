server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 简历文件最大 10MB,与后端限制一致
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # LLM 生成可能耗时较长
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
